<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Combustible</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="../shared/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
  <style>
    :root {
      --bg: #F2F2F7;
      --card-bg: #FFF;
      --text-primary: #000;
      --text-secondary: #6D6D72;
      --text-tertiary: #AEAEB2;
      --system-blue: #007AFF;
      --sep: #C6C6C8;
      --green: #34C759;
      --red: #FF3B30;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --card-bg: #1C1C1E;
        --text-primary: #FFF;
        --text-secondary: #8E8E93;
        --text-tertiary: #636366;
        --system-blue: #0A84FF;
        --sep: #38383A;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 12px 16px 8px 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .header-title p {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .refresh-btn {
      background: none;
      border: none;
      color: var(--system-blue);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .refresh-btn:active {
      opacity: 0.5;
    }

    .pill {
      background: rgba(0, 122, 255, 0.12);
      border-radius: 10px;
      padding: 2px 7px;
      display: inline-flex;
      align-items: center;
    }

    @media (prefers-color-scheme: dark) {
      .pill {
        background: rgba(10, 132, 255, 0.12);
      }
    }

    .pill span {
      font-size: 12px;
      font-weight: 700;
      color: var(--system-blue);
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2px 10px;
    }

    /* Rows */
    .row {
      display: flex;
      align-items: center;
      padding: 6px 0;
      cursor: pointer;
    }

    .row:active {
      opacity: 0.6;
    }

    .row + .row {
      border-top: 0.5px solid var(--sep);
      margin-left: 0;
    }

    .row-separator {
      border-top: 0.5px solid var(--sep);
      margin-left: 22px;
    }

    .dot {
      font-size: 6px;
      line-height: 1;
      flex-shrink: 0;
      width: 14px;
      text-align: center;
    }

    .dot.available {
      color: var(--green);
    }

    .dot.unavailable {
      color: var(--text-tertiary);
    }

    .station-detail {
      min-width: 0;
    }

    .station-title {
      display: flex;
      align-items: baseline;
    }

    .station-reading {
      display: block;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .station-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-company {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-tertiary);
      margin-left: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .station-litros {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      margin-left: auto;
      padding-left: 8px;
      flex-shrink: 0;
    }

    .station-litros.available {
      color: var(--text-primary);
    }

    .station-litros.unavailable {
      color: var(--text-secondary);
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      margin-top: 8px;
      padding: 0 2px;
    }

    .footer-text {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">
        <h1>Combustible</h1>
        <p>Gasolina Especial &middot; Santa Cruz</p>
      </div>
      <div class="header-right">
        <button class="refresh-btn" id="refreshBtn" aria-label="Actualizar">&#x21BB;</button>
        <div class="pill" id="pill" style="display:none;">
          <span id="pillText"></span>
        </div>
      </div>
    </div>
    <div class="card" id="listCard">
      <div class="loading" id="loading">Cargando...</div>
    </div>
    <div class="footer">
      <span class="footer-text" id="footerTime" role="status"></span>
    </div>
  </div>

  <script type="module">
    import { STATIONS } from '../shared/stations.js';
    import { fetchAllStations, getNavUrl, coalesceRefresh, stockLabel, stockSummary } from '../shared/fetchers.js?v=ped-56';

    const listCard = document.getElementById('listCard');
    const loading = document.getElementById('loading');
    const pill = document.getElementById('pill');
    const pillText = document.getElementById('pillText');
    const footerTime = document.getElementById('footerTime');
    const refreshBtn = document.getElementById('refreshBtn');

    const loadData = coalesceRefresh(async ({ refresh = false } = {}) => {
      if (!listCard.querySelector('.row')) {
        loading.textContent = 'Cargando…';
        loading.style.display = 'block';
      }

      try {
        const results = await fetchAllStations(STATIONS, { refresh });
        results.sort((a, b) => Number(b.available) - Number(a.available) || (b.litros ?? -1) - (a.litros ?? -1));
        listCard.querySelectorAll('.row, .row-separator').forEach((el) => el.remove());

        loading.style.display = 'none';

        const countAvail = results.filter((r) => r.available).length;
        pillText.textContent = `${countAvail}/${results.length}`;
        pill.style.display = 'inline-flex';

        for (let i = 0; i < results.length; i++) {
          const r = results[i];

          if (i > 0) {
            const sep = document.createElement('div');
            sep.className = 'row-separator';
            listCard.appendChild(sep);
          }

          const row = document.createElement('div');
          row.className = 'row';

          const dot = document.createElement('span');
          dot.className = `dot ${r.available ? 'available' : 'unavailable'}`;
          dot.textContent = '\u25CF';

          const name = document.createElement('span');
          name.className = 'station-name';
          name.textContent = r.name;

          const company = document.createElement('span');
          company.className = 'station-company';
          company.textContent = r.company;

          const litros = document.createElement('span');
          const pct = r.litros != null && r.capacidad > 0 ? Math.min(Math.round(r.litros / r.capacidad * 100), 100) : null;
          litros.className = `station-litros ${r.available ? 'available' : 'unavailable'}`;
          litros.textContent = r.litros == null ? '—' : `${r.litros.toLocaleString('es-BO')} L${pct == null ? '' : ` (${pct}%)`}`;

          const detail = document.createElement('div');
          detail.className = 'station-detail';
          const title = document.createElement('div');
          title.className = 'station-title';
          title.append(name, company);
          const reading = document.createElement('small');
          reading.className = 'station-reading';
          reading.textContent = stockLabel(r);
          detail.append(title, reading);

          row.append(dot, detail, litros);
          row.addEventListener('click', () => window.open(getNavUrl(r), '_blank'));

          listCard.appendChild(row);
        }

        footerTime.textContent = stockSummary(results);
      } catch (err) {
        loading.textContent = 'Error al cargar datos';
        console.error('Error:', err);
      }
    });

    refreshBtn.addEventListener('click', () => loadData({ refresh: true }));

    // Initial load
    loadData();

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.log('SW registro fallido:', err);
      });
    }
  </script>
</body>
</html>
